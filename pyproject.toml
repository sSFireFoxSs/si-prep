[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "si_prep"
version = "0.1.0"
description = "SI 프로젝트 산출물을 업무 항목·근거 연결 데이터로 만드는 전처리 도구"
requires-python = ">=3.11"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "KimSeungJu" }]
classifiers = ["Development Status :: 4 - Beta"]
dependencies = [
    "openpyxl>=3.1.5",
    "pydantic>=2.13",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
